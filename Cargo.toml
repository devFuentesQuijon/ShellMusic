[package]
name = "shellmusic"
version = "0.3.0"
edition = "2024"
description = "TUI ultraliviana para buscar y reproducir música de YouTube Music y SoundCloud (mpv + yt-dlp)"
license = "MIT"
repository = "https://github.com/devFuentesQuijon/ShellMusic"
homepage = "https://github.com/devFuentesQuijon/ShellMusic"
readme = "README.md"
keywords = ["music", "tui", "youtube", "soundcloud", "terminal"]
categories = ["command-line-utilities", "multimedia::audio"]
exclude = ["/.github", "/docs", "/scripts"]

[[bin]]
name = "smusic"
path = "src/main.rs"

[dependencies]
anyhow = "1"
arboard = "3"
async-trait = "0.1"
crossterm = { version = "0.29", features = ["event-stream"] }
dirs = "7"
futures-util = "0.3"
ratatui = "0.30"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = [
    "io-util",
    "io-std",
    "macros",
    "net",
    "process",
    "rt-multi-thread",
    "sync",
    "time",
] }
toml = "1"
url = "2"
notify-rust = "4"
reqwest = { version = "0.12", default-features = false, features = [
    "json",
    "rustls-tls",
] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
ratatui-image = { version = "11", default-features = false, features = ["crossterm"] }
md5 = "0.8"

[target.'cfg(target_os = "linux")'.dependencies]
# Backend zbus (pure Rust): no requiere libdbus del sistema.
souvlaki = { version = "0.8", default-features = false, features = ["use_zbus"] }

[profile.release]
strip = true
lto = true
codegen-units = 1
