name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.artifact }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: smusic-linux-x86_64
            mcp_artifact: smusic-mcp-linux-x86_64
            binary: smusic
          - os: macos-latest
            artifact: smusic-macos-aarch64
            mcp_artifact: smusic-mcp-macos-aarch64
            binary: smusic
          - os: windows-latest
            artifact: smusic-windows-x86_64.exe
            mcp_artifact: smusic-mcp-windows-x86_64.exe
            binary: smusic.exe
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Rust stable
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Build release
        run: cargo build --release --locked

      - name: Empaquetar binarios
        shell: bash
        run: |
          mkdir -p dist
          cp "target/release/${{ matrix.binary }}" "dist/${{ matrix.artifact }}"
          cp "target/release/smusic-mcp" "dist/${{ matrix.mcp_artifact }}"
          chmod +x "dist/${{ matrix.artifact }}" "dist/${{ matrix.mcp_artifact }}" || true
          ls -la dist

      - name: Instalar Inno Setup
        if: runner.os == 'Windows'
        run: choco install innosetup -y --no-progress

      - name: Compilar instalador (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $v = "${{ github.ref_name }}" -replace '^v', ''
          if ($v -notmatch '^\d+(\.\d+){0,3}$') { $v = '0.0.0' }
          $parts = @($v.Split('.')) + @('0', '0', '0', '0')
          $info = ($parts[0..3]) -join '.'
          & "C:\Program Files (x86)\Inno Setup 6\iscc.exe" `
            "/DAppVersion=$v" "/DVersionInfo=$info" installer\smusic.iss

      - name: Publicar en GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          files: |
            dist/${{ matrix.artifact }}
            dist/${{ matrix.mcp_artifact }}
            dist/smusic-windows-x86_64-setup.exe
