name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --locked

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Tests (unitarios y de render; los de integración son #[ignore])
        run: cargo test

      - name: Instalar mpv y ffmpeg (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y mpv ffmpeg

      - name: Test de integración IPC de mpv (archivo local, sin red)
        if: runner.os == 'Linux'
        run: cargo test --locked --test mpv_ipc_local -- --ignored --nocapture
