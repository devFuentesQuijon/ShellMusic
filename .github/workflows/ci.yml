name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Rust stable
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Build
        run: cargo build --locked

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Tests (unitarios y de render; los de integración son #[ignore])
        run: cargo test

      - name: Instalar mpv y ffmpeg (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y mpv ffmpeg

      - name: Instalar mpv (macOS; ffmpeg viene como dependencia)
        if: runner.os == 'macOS'
        run: brew install mpv

      - name: Instalar mpv y ffmpeg (Windows)
        if: runner.os == 'Windows'
        run: |
          choco install mpv ffmpeg -y --no-progress
          # El paquete choco de mpv no siempre deja mpv.exe en el PATH:
          # localizarlo y registrarlo explícitamente para los pasos siguientes.
          $mpv = Get-ChildItem -Path C:\ProgramData\chocolatey -Recurse -Filter mpv.exe -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $mpv) { throw "mpv.exe no encontrado tras la instalación" }
          Write-Output "mpv encontrado en $($mpv.FullName)"
          Add-Content $env:GITHUB_PATH $mpv.DirectoryName

      - name: Test de integración IPC de mpv (archivo local, sin red)
        run: cargo test --locked --test mpv_ipc_local -- --ignored --nocapture
